name: Daily Auto Patch

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel:
          - dist_tag: latest
            fallback: '16.2.7'
          - dist_tag: canary
            fallback: '16.3.0-canary.38'
          - dist_tag: backport
            fallback: '15.5.19'
    env:
      # Ensure we run in CI-mode inside the script
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve upstream tag (${{ matrix.channel.dist_tag }})
        id: resolve_tag
        run: |
          TAG=$(npm info next dist-tags.${{ matrix.channel.dist_tag }} 2>/dev/null || echo '${{ matrix.channel.fallback }}')
          # Normalize to start with 'v'
          TAG="v${TAG#v}"
          echo "Resolved TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Load last published tag
        id: load_last
        run: |
          LAST_FILE=".last_published_tag_${{ matrix.channel.dist_tag }}"
          if [ -f "$LAST_FILE" ]; then
            LAST_TAG=$(cat "$LAST_FILE" | tr -d '\n' || true)
          else
            LAST_TAG=""
          fi
          echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV

      - name: Skip if unchanged
        id: skip_check
        run: |
          echo "Current TAG: ${TAG}"
          echo "Last published TAG: ${LAST_TAG}"
          if [ "${TAG}" = "${LAST_TAG}" ]; then
            echo "No new tag detected; skipping patch generation."
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug secrets access
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          echo "NPM_TOKEN is set: $([[ -n "$NPM_TOKEN" ]] && echo 'YES' || echo 'NO')"
          echo "GITHUB_TOKEN is set: $([[ -n "$GITHUB_TOKEN" ]] && echo 'YES' || echo 'NO')"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Preflight: configure npm auth and verify identity"
        if: steps.skip_check.outputs.should_skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "ERROR: NPM_TOKEN secret is not set."
            exit 1
          fi
          # write user-scoped npmrc for runner (do not commit)
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm whoami
          npm ping

      - name: Configure git identity
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Make script executable
        if: steps.skip_check.outputs.should_skip != 'true'
        run: chmod +x ./scripts/generate-and-apply-patch.sh

      - name: Run generate-and-apply-patch script
        if: steps.skip_check.outputs.should_skip != 'true'
        id: run_patch
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLONE_PROTOCOL: https
          TAG: ${{ env.TAG }}
        run: |
          set -o pipefail
          ./scripts/generate-and-apply-patch.sh

      - name: Save last published tag
        if: steps.skip_check.outputs.should_skip != 'true' && success()
        run: |
          echo "${TAG}" > .last_published_tag_${{ matrix.channel.dist_tag }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_published_tag_${{ matrix.channel.dist_tag }}
          git commit -m "chore(ci): update last published tag (${{ matrix.channel.dist_tag }}) to ${TAG}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed; ensure GITHUB_TOKEN has repo permissions"

      - name: Create GitHub Release
        if: steps.skip_check.outputs.should_skip != 'true' && success()
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.TAG }}
          release_name: "Automated patch ${{ env.TAG }} (${{ matrix.channel.dist_tag }})"
          body: |
            Automated patch generated for Next.js ${{ matrix.channel.dist_tag }} tag ${{ env.TAG }}.
            The patches and dist artifacts are available in the repository under the `patches/` directory.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
